# /etc/orphan-watchdog.conf
# Configuration for orphan-watchdog

# Set to true to log runaway processes without terminating them
DRY_RUN=false

# Minimum sustained CPU percentage to consider an orphaned process a runaway
CPU_THRESHOLD=40.0

# Minimum sustained CPU percentage for targeted runaway process types (TARGETS)
TARGET_CPU_THRESHOLD=25.0

# Measurement sample interval in seconds
SAMPLE_INTERVAL=1.0

# Site- and machine-specific process whitelist (additive to builtin system defaults).
# Builtin defaults: systemd, init, dbus-daemon, pipewire, wireplumber, pulseaudio, xwayland, gnome-shell, polkitd.
WHITELIST=stremio,chrome,discord,tor,warp-svc,warp-taskbar,mysterium-node,earlyoom,NetworkManager,wpa_supplicant,gdm,accounts-daemon,irqbalance,cron,rsyslogd,thermald,snapd

# Targeted runaway process patterns (additive to builtin defaults: node, npm, npx, mcp-server, python, python3).
# Note: Linux kernel limits /proc/[pid]/comm to 15 characters; patterns must match the truncated comm.
TARGETS=
